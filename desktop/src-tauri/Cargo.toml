# iKratom desktop shell — a ~5MB native window around the live web app
# (https://www.ikratom.org) via the OS WebView2. Built ONLY in CI
# (.github/workflows/desktop-build.yml) on desktop-v* tags; no local
# Rust toolchain required for web development.
[package]
name = "ikratom-desktop"
version = "1.0.1"
description = "iKratom — The Advocate's Toolbelt"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# time 0.3.48 (published 2026-06-12) breaks tauri-utils 2.9.2 with a trait-
# coherence error (E0119). Pin to the last-good version until tauri ships a
# fix; CI re-resolves the whole graph every run because Cargo.lock isn't
# committed, so unpinned = builds break whenever upstream publishes.
time = "=0.3.47"
