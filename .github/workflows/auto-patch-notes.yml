name: Daily patch-note auto-draft

# Auto-generate a "what's new" patch-note draft each morning so /whats-new
# stays current without manual effort.
#
# ⚠️ CHANGED 2026-09-17 — read before editing.
# This used to open a pull request containing a new
# src/content/patch-notes/*.md file, to be squash-merged by hand. That merge
# was a production build: netlify.toml's `ignore` rule excludes
# `:(exclude,glob)*.md`, and git's glob magic stops `*` at a `/`, so only
# TOP-LEVEL markdown skips a build — a note nested under src/content/ never
# did. Telling people what changed cost 15 credits, so the cheapest action was
# to merge nothing: seven drafts piled up between 2026-08-26 and 2026-09-17
# and the public changelog went stale.
#
# Now the draft is written straight into the `patch_notes` table (migration
# 0250) with status='draft'. No branch, no PR, no build. An admin reviews it
# at /admin/whats-new and presses Publish, and the note appears on the next
# request.
#
# THE CURATION STEP SURVIVED THE CHANGE ON PURPOSE. Generator output is a
# starting point, never publishable copy — raw commit subjects once shipped an
# editor instruction onto the public page (PR #691). `--db` writes a DRAFT and
# nothing else; only a human makes a note public.
#
# Trigger: every weekday at 11:00 UTC (~6am ET) so an admin has a fresh draft
# waiting. Workflow_dispatch fires it manually any time.

on:
  schedule:
    - cron: "0 11 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: auto-patch-notes
  cancel-in-progress: false

jobs:
  draft-patch-note:
    runs-on: ubuntu-latest
    # Read-only now. The job no longer pushes a branch or opens a PR, so it
    # does not need contents:write or pull-requests:write.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # need full history for the git log lookback
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci --omit=dev --ignore-scripts

      - name: Report changelog gaps
        # The old failure mode of this job was SILENCE: it opened a PR and
        # waited for a human, and when nobody merged, nothing complained.
        # Seven days of changelog went missing that way and stayed missing for
        # three months. Still reporting-only (never fails the job) — a hole
        # lands in the run summary instead of nowhere.
        run: node scripts/check-changelog-gaps.mjs --days 120

      - name: Write today's draft into patch_notes
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # Writes scraper_runs source `patch_note_draft`, registered in
        # scripts/lib/cron-pager-registry.mjs — if this stops running, the
        # self-pager says so instead of the changelog quietly going stale
        # again.
        run: node scripts/generate-patch-note.mjs --since "24 hours ago" --db
