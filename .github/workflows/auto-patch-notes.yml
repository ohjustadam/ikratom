name: Daily patch-note auto-draft

# Auto-generate a "what's new" patch-note draft each morning so /whats-new
# stays current without manual effort. Opens a PR with the draft —
# admin reviews + merges (often a 1-click).
#
# Trigger: every weekday at 11:00 UTC (~6am ET) so admins see a fresh
# draft in their inbox when they wake. Workflow_dispatch lets you fire
# it manually any time.

on:
  schedule:
    - cron: "0 11 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: auto-patch-notes
  cancel-in-progress: false

jobs:
  draft-patch-note:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # need full history for the git log lookback
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Report changelog gaps
        # The failure mode of this job is SILENCE: it opens a PR and waits for a
        # human, and when nobody merges, nothing complains. Seven days of
        # changelog went missing that way and stayed missing for three months.
        # Reporting-only (never fails the job) — it writes any hole into the run
        # summary so a dropped draft surfaces the next morning instead of never.
        run: node scripts/check-changelog-gaps.mjs --days 120

      - name: Generate patch-note draft for the last 24 hours
        id: gen
        run: |
          node scripts/generate-patch-note.mjs --since "24 hours ago"
          # Detect whether a new file landed in src/content/patch-notes
          NEW=$(git status --porcelain src/content/patch-notes/ | awk '/^\?\?/ {print $2}' | head -1)
          if [ -z "$NEW" ]; then
            echo "No new patch note generated (no commits in last 24h, or file already exists)."
            echo "should_pr=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Generated $NEW"
          echo "patch_file=$NEW" >> "$GITHUB_OUTPUT"
          echo "should_pr=true" >> "$GITHUB_OUTPUT"
          # Extract title for PR title
          TITLE=$(grep -m1 '^title:' "$NEW" | sed -E 's/title: "(.*)"/\1/')
          echo "patch_title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Open PR with draft + enable auto-merge
        if: steps.gen.outputs.should_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # main has a branch ruleset requiring all changes go through a
        # PR, so the bot can't push straight to main — it must open a
        # PR. For `gh pr create` to work with GITHUB_TOKEN, the repo
        # setting Settings → Actions → General → "Allow GitHub Actions
        # to create and approve pull requests" must be ON. If this step
        # fails with "GitHub Actions is not permitted to create or
        # approve pull requests", that setting is off — flip it once.
        # The PR only touches src/content/patch-notes/*.md, so auto-
        # merge lands it as soon as Vercel preview passes.
        run: |
          BR="auto-patch-note-$(date -u +%Y%m%d)"
          git config user.name "ikratom-bot"
          git config user.email "noreply@ikratom.org"
          git checkout -b "$BR"
          git add "${{ steps.gen.outputs.patch_file }}"
          git commit -m "docs: ${{ steps.gen.outputs.patch_title }} (auto-draft)"
          git push -u origin "$BR"
          PR_URL=$(gh pr create \
            --title "docs: ${{ steps.gen.outputs.patch_title }} (auto-draft)" \
            --body "Auto-generated patch-note draft covering the last 24 hours. Markdown-only (\`src/content/patch-notes/*.md\`). Review and squash-merge when the copy reads right. 🤖 .github/workflows/auto-patch-notes.yml" \
            --label "patch-notes,auto-draft")

          # Auto-merge is DELIBERATELY disabled on this repo (see AGENTS.md:
          # allow_auto_merge was skipped, and the documented flow is a manual
          # `gh pr merge --squash --delete-branch` after CI passes). Requesting
          # it therefore hard-fails with:
          #   GraphQL: Auto merge is not allowed for this repository
          # ...AFTER the branch and PR were already created successfully. So the
          # job did its whole job and still reported failure every single day,
          # which is how a red X stops meaning anything.
          #
          # Try it, but never fail the run over it: if auto-merge is ever turned
          # on the draft lands by itself, and if it stays off the PR simply waits
          # for a human — which is the current policy anyway.
          gh pr merge "$PR_URL" --auto --squash --delete-branch \
            || echo "note: auto-merge unavailable (disabled for this repo) — PR left open for manual review: $PR_URL"
