# Intel step 1, every state: verify each state's agency newsroom and state
# register page FROM GITHUB'S IPS (where the daily BoP scrape runs; several
# state WAFs treat a home IP and a datacenter IP differently), then register
# the ones that pass as bop_sources. Candidates: scripts/data/state-intel-sources.json.
#
# Run it from the Actions tab (workflow_dispatch), or push a branch named
# intel-verify/<anything> for a dry run (verify + report only). --apply runs
# only from the Actions tab. Inserts skip any source
# already present, so a re-run is safe. The report is uploaded as an artifact
# (URLs and HTTP results only: public information).
name: Intel sources verify

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Insert passing sources into bop_sources"
        type: boolean
        default: false
      states:
        description: "Comma-separated state codes (blank = all)"
        type: string
        default: ""
  push:
    branches: ["intel-verify/**"]

concurrency:
  group: intel-sources-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Verify (and register) state intel sources
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APPLY: ${{ inputs.apply == true }}
          STATES: ${{ inputs.states }}
        run: |
          set -o pipefail
          flags="--browser --report intel-sources-report.json"
          if [ "$APPLY" = "true" ]; then flags="$flags --apply"; fi
          if [ -n "$STATES" ]; then flags="$flags --states $STATES"; fi
          node --import=./scripts/lib/egress-meter.mjs scripts/register-state-intel-sources.mjs $flags 2>&1 | tee verify.log
          { echo '```'; grep -E '^(✓|✗)|passed|Inserted|·' verify.log | tail -200; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intel-sources-report
          path: intel-sources-report.json
          retention-days: 30
