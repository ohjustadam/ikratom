          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: node scripts/evaluate-research-papers.mjs --limit 50

  legiscan-wide-pass:
    # Daily sweep of every active anti/pro bill via LegiScan. The hourly
    # cron only hits the 30 most-stale; this catches everything else
    # at least once a day even if hourly never gets to it.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      # OpenStates daily bill sweep — the ONLY path that refreshes
      # last_action/last_action_at for bills with no legiscan_bill_id
      # (which is ALL NY bills as of 2026-05-28 + most non-LegiScan
      # states). Without this, NY bills go stale forever — confirmed
      # 2026-05-28 when S8925A sat at a Jan 16 action while the actual
      # state was "advanced to third reading" on May 26. continue-on-
      # error so an OpenStates quota exhaustion doesn't tank the rest.
      #
      # UNINTERRUPTED-FLOW HARDENING (2026-07-05, run 28761551479 RCA):
      # this JOB hit its 60-min timeout → GitHub cancelled it mid-step →
      # 5 dependent jobs (committees, stance, clusters incl. the DAILY
      # BRIEF PUSH, journeys, committee backfill) were cascade-SKIPPED.
      # Fix = three layers: (1) each step gets its own timeout-minutes
      # so no single step can eat the job budget; (2) scripts self-limit
      # via --max-minutes and record partial telemetry BEFORE any kill;
      # (3) dependents run on `if: !cancelled()` so a slow sweep never
      # silences the rest of the pipeline again.
      - name: OpenStates daily bill sweep (refreshes last_action_at for non-LegiScan bills)
        continue-on-error: true
        timeout-minutes: 20
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
        run: node scripts/sync-bills.mjs --max-minutes 18
      - name: LegiScan full sweep (all active anti + pro bills)
        # Best-effort like the rest: a LegiScan hiccup must not cancel the
        # dependents. Persistent silence is caught by check-cron-staleness
        # via the sync_bills_legiscan_all scraper_runs source.
        continue-on-error: true
        timeout-minutes: 25
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
        run: node scripts/sync-bills-via-legiscan.mjs --all-anti --max-minutes 22
      # OpenStates fallback for vote data. Runs AFTER the LegiScan
      # step so any bill LegiScan already covered shows up in
      # bill_votes and this script skips it. When LEGISCAN_API_KEY
      # isn't set (the current state), this becomes the primary path
      # — it'll chip away at the backlog at ~50 bills/day inside the
      # OpenStates 250/day free-tier limit. continue-on-error so an
      # OS quota exhaustion from earlier in the day doesn't break
      # the rest of the daily run.
      - name: OpenStates vote-sync fallback (~50 bills/day budget)
        continue-on-error: true
        timeout-minutes: 12
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
        run: node scripts/sync-bill-votes-via-openstates.mjs --limit 50

  backfill-bill-committees:
    # Safety net: scans every active bill with a committee mention in
    # last_action but no current_committee_name and populates the
    # column. Idempotent. Catches anything that:
    #   - was synced via OpenStates (sync-bills.mjs) before that script
    #     started writing current_committee_name itself
    #   - has last_action text that the parser CAN match but didn't
    #     hit through the normal write path
    # Runs after legiscan-wide-pass so the most-recent LegiScan data
    # is in place first; only fills in residual gaps.
    needs: legiscan-wide-pass
    # Best on fresh data, still correct on yesterday's — never skip.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Backfill current_committee_name from bills.last_action
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backfill-bill-committees.mjs

  index-legislator-news-mentions:
    # Phase 3 D4: scan news_items for per-legislator name mentions.
    # Builds two regex patterns per legislator:
    #   1. Exact full-name
    #   2. Title+lastname (Sen./Rep./Delegate/Assemblymember + last name)
    # Writes hits to legislator_news_mentions. State-scoped to reduce
    # false positives. Idempotent via UNIQUE(legislator_id, news_item_id,
    # matched_field).
    #
    # Surfaces on /legislators/[id]/briefing under "📰 News mentions".
    # Cheap — pure DB regex scan, no AI calls. Daily is plenty since
    # news_items come in hourly but per-legislator mention rate is low.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Index per-legislator name mentions in news
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/index-legislator-news-mentions.mjs

  correlate-news-bills-ai:
    # AI semantic news↔bill correlation. The hourly regex pass catches
    # explicit bill-number mentions; this fills in articles that cover
    # a specific bill thematically without naming the bill number.
    #
    # Runs daily because Gemini grounding has a 1,500/day free-tier
    # cap. --ai-limit 200 per run keeps headroom for other intel
    # jobs that share the quota.
    #
    # Gated by migration 0150's bill_ai_correlation_attempted_at so
    # the AI pass doesn't re-evaluate rows it has already scored.
    # Pre-migration deploys see the column missing and the script
    # exits gracefully via the Supabase error.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: AI-correlate unmatched news to bills
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: node scripts/correlate-news-to-bills.mjs --ai --ai-limit 200

  detect-bill-clusters:
    # Coordinated-operation detection across active anti/pro bills.
    # Runs after legiscan-wide-pass so the freshest bill text is in
    # place when we cluster. Pattern-based v1 (regex on title +
    # summary + bill_text_versions) — cheap, no AI. Idempotent:
    # cluster + member rows are upserted on each run.
    needs: legiscan-wide-pass
    # CRITICAL to never skip: this job carries the DAILY BRIEF PUSH.
    # When legiscan-wide-pass timed out on 2026-07-05, this was skipped
    # and users got no brief. Clustering on day-old data beats no brief.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Detect coordinated-operation clusters
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/detect-bill-clusters.mjs
      - name: Align bills to research library
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/align-bills-to-research.mjs
      - name: Fire daily-brief push to opted-in users
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          APP_URL: ${{ secrets.APP_URL }}
        run: node scripts/fire-daily-brief-push.mjs
      # Pre-render today's brief as an MP3 with Edge TTS (Christopher
      # Neural). The /brief page picks this up automatically via the
      # daily-brief-audio storage bucket; clients with no neural voice
      # installed (Windows base install, older mobile OSes) get the
      # high-quality audio anyway.
      - name: Render daily brief audio (Edge TTS Neural)
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/render-daily-brief-audio.mjs

  enrich-bill-journey:
    # Regenerate the 4-paragraph journey narrative + 200-300 word
    # summary_long for active anti/pro bills. Pulls every version's
    # PDF from OpenStates (or FastDemocracy fallback), then routes
    # through the AI router (Groq → Gemini → Cerebras → Mistral →
    # Cloudflare → Ollama).
    #
    # Without this job in cron, bills whose summary_long was cleared
    # by hygiene-misclassified-anti-bills.mjs (PR #325) never get
    # repopulated. PR #328 also depends on this running with the
    # session-filtered OpenStates lookup so re-enrichment produces
    # the CORRECT bill's text rather than a same-numbered bill from
    # a different session.
    #
    # Runs AFTER legiscan-wide-pass so the freshest version list is
    # available. --all-stale picks up any bill whose journey is older
    # than 7 days OR null (e.g. the 39 cleared in PR #325). The
    # script caps at LIMIT (default 20) per run to spread AI quota
    # across many days — full backfill takes ~2 daily runs.
    needs: legiscan-wide-pass
    # Journeys enrich yesterday's text fine — never cascade-skip.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Re-enrich stale + cleared bill journeys
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: node scripts/enrich-bill-journey.mjs --all-stale --limit 30

  classify-bill-substance:
    # State Mission Control PR1 — dedicated 7-OH / substance classifier.
    # Reads already-stored bill text (bill_text_versions / summary_long /
    # summary) and routes through the free-tier AI router to fill the
    # 5-key substance_targeting map + derive targets_natural_leaf /
    # targets_synthetic_only. No OpenStates fetch (so it never competes
    # with the journey pass for the 250/day quota).
    #
    # Runs AFTER enrich-bill-journey so any freshly-synced bill_text_versions
    # are available to classify. Idempotent: only touches bills it doesn't
    # already own (substance_targeting_source != 'ai-substance-pass-v1'),
    # capped at --limit per run to spread AI quota across days.
    needs: enrich-bill-journey
    # Run even if the journey pass failed or timed out — independent enough
    # that the substance classify + downstream derive should still recompute.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Classify bill substance targeting
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: node scripts/classify-bill-substance.mjs --limit 40

  derive-state-status:
    # State Mission Control PR2 — recompute canonical per-state leaf + 7-OH
    # status into state_status from enacted, scope='state' bills + their
    # substance_targeting. Runs AFTER classify-bill-substance so the latest
    # substance map is available. No AI calls (reads stored classification).
    # Idempotent; preserves admin overrides. Flags edge cases needs_review.
    needs: classify-bill-substance
    # Always recompute even if upstream enrich/classify failed or timed out.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Derive per-state status
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # Writes derived_* + needs_review into state_status (feeds the
        # /admin/state-status confirm queue). SAFE to --apply: the public
        # StatusHeader renders ONLY admin-confirmed rows, so unreliable
        # auto-derivations never surface publicly (fix/data-accuracy 2026-06-06).
        run: node scripts/derive-state-status.mjs --apply

  queue-due-state-flips:
    # Surface FUTURE-DATED legal changes (state_status_flips, migration 0179) —
    # e.g. TN's leaf ban effective Jul 1, 2026 — into the /admin/state-status
    # confirm queue on their effective date, and notify the owner. Runs AFTER
    # derive-state-status so its needs_review flag wins for the day (derive
    # rewrites needs_review nightly). Does NOT auto-publish — the owner confirms.
    needs: derive-state-status
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Queue due state-status flips into the confirm queue
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/queue-due-state-flips.mjs --apply

  sync-legistar-officials:
    # FREE, non-grounded local-officials source: the Legistar (Granicus)
    # webapi exposes authoritative current council/board rosters (the
    # clerk's own system) with NO key and NO per-day cap. Seeds major-metro
    # councils so they never spend a scarce Gemini-grounded call, and
    # closes matching local_rep_requests. Tenants whose Legistar lacks a
    # membership roster are skipped (the SearXNG+Ollama batch covers those).
    # Auto-discovers new tenants first (keyless probe) to widen coverage.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Discover new Legistar tenants (expand keyless coverage)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/discover-legistar-tenants.mjs --limit 200
      - name: Sync local officials from Legistar webapi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-legistar-officials.mjs
