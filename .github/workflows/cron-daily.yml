name: Daily cron

# Daily-frequency jobs that aren't worth running hourly. Runs at
# 10:17 UTC (~5am ET / 2am PT) so admins see results when they wake.
# Minute 17 (not :00) so this big fan-out doesn't start on the same
# clock-edge as the hourly cron's :00 tick — they'll still partially
# overlap (the hourly job can run ~30min), but they no longer launch
# simultaneously. See the 2026-06-08 OOM RCA.

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-cron
  cancel-in-progress: false

jobs:
  egress-watchdog:
    # The "never restricted again" failsafe (2026-07-16 incident): reads the
    # project's Prometheus metrics endpoint and pages the owner at 50/75/90%
    # of the 5GB/mo free-tier egress budget — weeks before a restriction.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Check egress usage vs free-tier budget
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Project ref derives from the URL inside the script — no extra secret.
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: node scripts/check-egress-usage.mjs

  verify-bill-status:
    # Layer 3 of the real-time pipeline (Layer 1 = bill_actions trigger;
    # Layer 2 = LegiScan primary sync). This is the safety net for
    # cases where BOTH OpenStates and LegiScan miss something — Gemini
    # with Google Search grounding fact-checks each active anti/pro
    # bill's status against live web data. Discrepancies become
    # policy_alerts on /admin/intel-health for admin triage.
    #
    # Quota cost: ~50 Gemini-grounded calls/day = well within 1500/day
    # free tier.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      # RETIRED 2026-06-11: verify-bill-status-ai.mjs called grounded Gemini
      # directly (generativelanguage.googleapis.com / gemini-2.5-flash +
      # google_search) — a violation of the de-Gemini / free-tier-only policy
      # (CLAUDE.md, PR-A) AND it failed 50/50 every run for days (red since
      # ~06-08). Authoritative bill status now comes from the LegiScan sync
      # (sync-bills-via-legiscan.mjs) once LEGISCAN_API_KEY is set — no AI
      # grounding needed. See V2_KICKOFF "BILL-DATA HEAL".
      - name: Auto-resolve sync discrepancies that don't need admin
        # For each scraper_stale alert, check:
        #   1. Did DB catch up since the alert was created? (resolve)
        #   2. Are DB+AI just status-synonyms? (resolve, e.g. committee == in_committee)
        #   3. Else if LegiScan key present: tie-break via LegiScan
        #      - LegiScan matches DB → AI was wrong (resolve)
        #      - LegiScan matches AI → update bill from LegiScan (resolve)
        # Cases that fail all of the above stay open for /admin/sync-discrepancies.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
        run: node scripts/auto-resolve-sync-discrepancies.mjs --limit 100

  openfec-donor-sync:
    # Refresh OpenFEC donor data for federal legislators (us_senate +
    # us_house). Once a day is plenty — campaign finance updates
    # quarterly. 50 legs/run = ~2 days to cover full ~700 federal
    # rep set on first pass; thereafter only refreshes the cache.
    # Falls back to no-op if OPENFEC_API_KEY isn't set.
    #
    # Second step: derive top_industries from the freshly-synced
    # top_employers via the ~30-bucket classifier (scripts/classify-
    # donor-industries.mjs). Runs in-job so new donor rows get their
    # industry breakdown the same tick they're synced. Cheap — pure
    # pattern matching, no AI, no external API.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: OpenFEC donor sync (50 most-stale federal legs)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENFEC_API_KEY: ${{ secrets.OPENFEC_API_KEY }}
        run: node scripts/sync-legislator-donors.mjs --limit 50
      - name: Classify donor industries from refreshed employers
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # --refresh because legislator_donors.top_employers may have
        # changed (new contribs in this cycle); re-derive industries
        # from scratch to avoid stale aggregates.
        run: node scripts/classify-donor-industries.mjs --refresh

  sync-bill-sponsors-all:
    # Back-fill bill_sponsors via OpenStates for every active anti/pro
    # bill across all 50 states. Critical for the /intel/threat-matrix
    # to surface hostile / champion legislators nationwide — without
    # this, structural signals are NY-only.
    #
    # The script is the same one that worked locally — bills that miss
    # a sponsor match keep sponsor_name_raw so the data isn't lost.
    # Polite at 1.2s/call → ~7 minutes for the full sweep at current
    # corpus size (~357 active bills). Idempotent via UNIQUE
    # (bill_id, legislator_id, classification).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Backfill bill sponsorships across all states
        # Best-effort backfill. The script self-limits to --max-minutes (writes
        # partial telemetry + exits 0 before the 30-min CI cap), so this normally
        # stays green. continue-on-error is defense-in-depth: a truly unexpected
        # error in this one best-effort job must not red the whole daily run —
        # check-cron-staleness now catches genuine silence via scraper_runs.
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
        run: node scripts/sync-bill-sponsors.mjs --all --max-minutes 24

  sync-stock-act-trades:
    # STOCK Act personal-trade disclosures for federal legislators
    # (Periodic Transaction Reports). Pulls Senate + House data from
    # community-maintained mirrors (Senate Stock Watcher GitHub +
    # House Stock Watcher S3). Free, no auth. Surfaces the
    # Mullin-Botanic-Tonics pattern: federal lawmakers with personal
    # financial exposure to kratom-adjacent industries (pharma opioid
    # makers, addiction treatment firms, substance-policy overlapping
    # tickers).
    #
    # As of first live run (2026-05-14): 8,350 Senate trades captured;
    # 213 flagged kratom-adjacent (Perdue / Carper / Moran trading
    # AbbVie / Pfizer / Merck / etc.). House data path was 403 at
    # probe time but the script attempts and skips gracefully when
    # the source is down.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Sync federal legislator STOCK Act trades
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-stock-act-trades.mjs

  lda-kratom-sync:
    # Pulls every Senate LDA filing mentioning kratom, refreshes our
    # lobbying_filings table. New filings drop quarterly so daily
    # is overkill but cheap (~25s wall time, no auth required) and
    # ensures we catch the day a new disclosure hits the public
    # record. ~131 filings as of May 2026.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Senate LDA kratom-filings sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-lda-kratom.mjs

  bop-browser-scrape:
    # BoP sources whose state .gov WAFs do TLS fingerprinting
    # (KS, NH, MA, AR currently) can't be scraped via Node fetch —
    # the JA3 signature gives us away regardless of headers. This
    # job uses a real Chromium browser via Playwright to bypass.
    #
    # Runs alongside the Vercel daily cron which handles the other
    # ~47 sources. The two together = full BoP coverage.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      # No --omit=dev here because we need playwright-chromium. Cheap —
      # ~2x dep download but still completes in well under a minute.
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Scrape TLS-blocked BoP sources via headless browser
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-bop-browser.mjs

  parse-bop-pdfs:
    # Layer 1.5 of the BoP classifier pipeline. Downloads PDF agendas
    # linked from BoP findings and extracts text via pdf-parse. The
    # regex classifier only saw link text; this gives it the actual
    # rule-proposal contents so PDF-only kratom rules can graduate
    # from 'unrelated' to 'kratom_direct' and become eligible for AI
    # classification on the next run.
    #
    # Runs AFTER bop-browser-scrape (so all candidates are present)
    # and BEFORE classify-bop-ai (so the AI layer sees upgrades).
    needs: bop-browser-scrape
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Download + parse PDFs from BoP findings
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/parse-bop-pdfs.mjs --limit 50

  classify-bop-ai:
    # Layer 2 of the BoP classifier pipeline. Regex pass runs inside
    # the scraper and flags candidates by title. This job picks up
    # candidates and runs Gemini Flash 2.5 with Google Search grounding
    # to read the linked PDF/page and produce a structured verdict.
    #
    # Quota: 1500 grounded requests/day on free tier. ~30 findings/run
    # = well under. Runs AFTER parse-bop-pdfs so PDF-upgraded candidates
    # are eligible (regex re-classified them based on PDF text).
    needs: parse-bop-pdfs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: AI-classify recent BoP findings via Gemini grounding
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/classify-bop-ai.mjs --limit 50

  resolve-news-urls:
    # Phase 2 of FP defense — resolve Google News redirect URLs to publisher
    # URLs so verify-news-body / extract-news-content can fetch the article.
    # KEYLESS HTTP decode (lib/google-news-decode.mjs) — no Chromium needed;
    # ~1s/item, so a higher limit clears the historical backlog over a few runs.
    #
    # Caches resolutions in news_items.resolved_url so we only resolve once per
    # article. Runs BEFORE verify-news-body so the body fetcher has fresh URLs.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Resolve Google News redirect URLs to publisher URLs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/resolve-news-urls.mjs --limit 400

  verify-news-body:
    # False-positive defense — two-phase pipeline:
    #   Phase 1: cheap title+summary keyword check (no network)
    #   Phase 2: fetch resolved_url, extract main body, keyword check
    #
    # Phase 2 rescues legit news-roundup articles whose title doesn't
    # mention kratom but whose body does (e.g. "Magnolia Mornings:
    # Feb 19"). Phase 2 only runs on items that the resolver job has
    # populated resolved_url for — see job above.
    #
    # /pulse + /news display layers hide body_has_kratom_keyword=FALSE;
    # NULL passes through so fresh items don't get blacked out.
    needs: resolve-news-urls
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Verify news article bodies for false-positive defense
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/verify-news-body.mjs --limit 200
      - name: Seed /news from newsworthy unlinked alerts
        # "If it's not in /news, create it." Alerts born outside the news
        # pipeline (bill-action trigger, BoP, manual) that cite a real NEWS
        # article get a /news row seeded + linked back. Gov/legislative/tracker
        # sources are skipped (not news). Runs BEFORE extract+summarize so the
        # seeded rows are enriched in the same pass. continue-on-error so a
        # transient write hiccup doesn't fail the daily run.
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/feed-news-from-alerts.mjs --apply
      - name: Derive local vote outcomes from alerts
        # Restructures local (city/county) kratom VOTE results from policy_alerts
        # into the local_vote_outcomes table (passed/failed/tabled) for /calendar
        # history + the .ics feed. Runs after feed-news so new local-vote alerts
        # are present. Idempotent (skips already-derived alerts); continue-on-error
        # so a write hiccup doesn't fail the daily run.
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/extract-local-vote-outcomes.mjs --apply
      - name: Extract in-app article excerpt + embedded media
        # Mines the resolved publisher HTML for a fair-use lead excerpt
        # (capped paragraphs) + embedded media (YouTube/Vimeo players,
        # article images) so /news/[id] renders the story in-app and
        # users can read/watch without leaving. continue-on-error so a
        # flaky publisher fetch doesn't fail the daily run.
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/extract-news-content.mjs --limit 300
      - name: Summarize news articles (our AI synthesis for /news/[id])
        # Guarantees every classified article has OUR 2-3 sentence summary even
        # when body extraction fails on JS-heavy sources (MSN/Yahoo) — so the
        # reader page is never empty. Copyright-safe (synthesis, not republish).
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/summarize-news.mjs --limit 120
      - name: Generate in-app news digests (full write-up)
        # FINAL enrichment step — runs AFTER extract+summarize so a brand-new
        # article embeds end-to-end (body + summary + our original full digest)
        # in ONE daily cycle instead of a day late. Our copyright-safe synthesis
        # (4-7¶) from the just-extracted source text; free-tier AI router.
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/generate-news-digest.mjs --limit 300 --days 90

  sync-usaspending-kratom:
    # Federal awards (grants + contracts) from USAspending.gov.
    # Surfaces who's getting paid by the feds for kratom-related work
    # — FDA contracts for human abuse potential studies, NIH grants
    # for academic kratom pharmacology, etc. As of first live run
    # (2026-05-14): 39 awards totaling $27.97M. Free API, no key.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Sync federal kratom awards (USAspending)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-usaspending-kratom.mjs

  sync-regulations-gov:
    # Federal rulemaking tracker via Regulations.gov. Pulls every
    # kratom-mentioning federal document (FDA/DEA/HHS/EPA/FTC notices,
    # NDI submissions, proposed/final rules, public comments). Works
    # with DEMO_KEY (~30/hr) out of the box; bump to a registered
    # key (REGULATIONS_GOV_API_KEY) for ~1000/hr quota. Small corpus
    # (62 docs as of 2026-05-14) so daily sync is more than enough.
    # The high-leverage rows are open_for_comment=true — surfaced
    # in every state briefing as a "submit comment NOW" CTA.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Sync federal kratom rulemaking
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REGULATIONS_GOV_API_KEY: ${{ secrets.REGULATIONS_GOV_API_KEY }}
        run: node scripts/sync-regulations-gov-kratom.mjs --max-pages 5

  sync-courtlistener-kratom:
    # Court litigation tracking via CourtListener (Free Law Project).
    # Pulls federal + state court opinions AND active RECAP dockets
    # mentioning kratom. Free unlimited API, no key required.
    # Surfaces industry-party cases (AKA/GKC/Botanic Tonics as named
    # plaintiff or defendant) — when a state passes a kratom ban, the
    # industry's next move is the courts. ~1,600 dockets + ~200
    # opinions in their index today; this script caps at 5 pages per
    # search (~100 results each) per run, so re-runs catch the
    # freshest cases. Idempotent UPSERT on cl_cluster_id / cl_docket_id.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Sync CourtListener kratom cases
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-courtlistener-kratom.mjs --max-pages 5

  scrape-utah-lobbying:
    # Phase 3 D2 pilot — scrape Utah's lobbyist registry. Single HTML
    # page, ~8MB, parses to ~6,800 registrations. Kratom-industry rows
    # (~16 today) upsert idempotently. Quick — runs in under 10s.
    # State briefing generator depends on this for fresh Utah intel,
    # but doesn't block: this job needs no upstream data.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Scrape Utah lobbyist registry
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-utah-lobbying.mjs

  generate-state-briefings:
    # Per-state field-work briefings — AI synthesizes live platform data
    # into a tactical briefing for each state's advocates. Page lives at
    # /briefings/state/[code]. See scripts/generate-state-briefing.mjs.
    #
    # Runs AFTER all the data-collection jobs so the briefing reflects
    # today's bill/news/BoP/state-lobbying state. ~5s per state × 51
    # states ≈ 5 min.
    needs: [classify-bop-ai, scrape-utah-lobbying, sync-courtlistener-kratom, sync-regulations-gov, sync-usaspending-kratom]
    # Never cascade-skip on an upstream failure. These 5 needs are external-API
    # collectors (the BoP Playwright chain notes House/state 403s); GitHub's
    # default `needs` requires SUCCESS, so one flaky API would SKIP this job —
    # which bundles the daily 50-state briefing regen, the intel-coverage check,
    # AND ~7 production queue-cleanup steps. Briefings degrade fine on yesterday's
    # intel and the cleanup steps are idempotent, so run regardless (matches the
    # legiscan-wide-pass dependents' `if: !cancelled()` hardening).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Regenerate all 50+DC state briefings
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: node scripts/generate-state-briefing.mjs --all-states
      # Phase 3 D7: audit briefings that came out of the blanket regen
      # and self-correct any with critique-blocked revisions or low
      # quality. Runs in-process so a single workflow run covers both
      # the generate + heal cycle. continue-on-error so a partial heal
      # doesn't fail the whole job.
      - name: Audit + heal briefings flagged by self-critique
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: node scripts/audit-state-briefings.mjs --auto-regen
      # Intel coverage matrix — daily snapshot of which states have
      # which intel layers populated. `--check` fails the step if
      # briefings or legislators drop below floor coverage, surfacing
      # silent breakage (e.g. cron-step failure, missing secret).
      - name: Intel coverage matrix check
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/intel-coverage-audit.mjs --check
      # Data-quality cleanup. Deactivates news_items where the body-
      # verifier said "no kratom keyword" AND the title also has no
      # kratom keyword — RSS title-match false positives (NBA player
      # stories, generic drug-overdose coverage, etc.). Without this
      # they keep polluting state news feeds forever. Idempotent.
      # First live run on 2026-05-14 deactivated 667 items.
      - name: Daily data-quality cleanup
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/cleanup-data-quality.mjs
      # V2_KICKOFF §3.A0 — retire active campaigns/alerts whose fight is
      # over (bill went terminal, or a news event duplicated a cluster's
      # canonical). Idempotent + self-healing; logs to scraper_runs as
      # 'daily_stale_campaign_cleanup'. First manual --apply run on
      # 2026-06-01 cleared 7 dedup + 1 retire + 12 alert-expire, then
      # re-ran clean (0 remaining) — proving it's safe for nightly.
      # The conservative --stale-months pass stays off so between-session
      # bills aren't retired prematurely.
      - name: Stale-campaign + alert cleanup
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/cleanup-stale-active-campaigns.mjs --apply
      # Rotating-campaign expiry (owner timeout model): stamp a 90d shelf-life on
      # auto-generated, non-standing campaigns + retire ORPHAN ones that are >90d
      # old AND 60d-quiet. Standing (is_standing) + manual + bill-linked campaigns
      # are never touched. Logs to scraper_runs as 'expire_rotating_campaigns'.
      - name: Expire stale rotating campaigns
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/expire-rotating-campaigns.mjs --apply
      # Auto-dedupe (topic-cluster collapse) + reject stale/FP-derived pending
      # auto-campaigns so the review queue doesn't fill with junk. Live mode.
      - name: Auto-clean the pending-campaign queue
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/cleanup-pending-campaigns.mjs
      # Auto-reject wrong-state pending alerts (per-state RSS mis-tags national
      # news to a state; the title is the trustworthy signal). Drains the
      # pending "intel queue" of geo-mismatched false positives.
      - name: Auto-reject wrong-state pending alerts
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/reject-wrongstate-pending-alerts.mjs --apply
      # Intel-queue cluster-janitor — collapse cross-outlet duplicates of one
      # story (the national FDA/DEA 7-OH push lands as ~16 near-identical alerts)
      # and re-scrapes of already-public stories, so the pending intel queue
      # doesn't pile up. The sibling of cleanup-pending-campaigns for the campaign
      # queue. Conservative (federalTopicKey + outlet-stripped title only; never
      # touches AKA alerts). Logs to scraper_runs as 'dedupe_pending_alerts'.
      - name: Auto-dedupe the pending intel queue
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # --stale-days 45: age-based expiry for GENUINE pending intel — without
        # it the intel queue only drains via manual owner review + the dedupe/
        # wrong-state janitors, so a review lapse grows it without bound
        # (the campaign queue already has a 45-day stale-reject; this matches).
        run: node scripts/dedupe-pending-alerts.mjs --apply --stale-days 45
      # Locality<->state DRIFT MONITOR: re-check every geo-tagged row against the
      # authoritative US gazetteer (scripts/lib/geo-resolver.mjs) and report any
      # mismatch via scraper_runs telemetry. DETECT-ONLY by design — it does NOT
      # auto-write, because even high-precision tiers can be fooled by source
      # bylines ("...Lincoln, NE") or non-kratom junk, and a wrong auto-write
      # would silently spread bad data. Corrections run ONLY through the
      # adversarially-verified path (--dump -> verify -> --apply-confirmed).
      # Write-time prevention (geo-resolver in the classifiers) keeps new rows clean.
      - name: Locality<->state drift monitor (gazetteer, detect-only)
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/audit-locality-states.mjs
      # NOTE: verify-local-bans (two-source gate for LOCAL kratom bans, 0190)
      # moved OFF this workflow in PR-A: it now runs nightly on the owner box
      # (SearXNG + local extract — keyless, no Gemini grounding). Registered
      # in check-cron-staleness under the "local-box" system.

  sync-committees-openstates:
    # Pull legislator committee assignments across ALL 51 states from
    # OpenStates v3 API. Stance drafter needs this data to identify
    # kratom-relevant candidates (Health / Judiciary / etc. committees).
    # Idempotent: upsert on (legislator_id, committee_name, session_id).
    #
    # 2026-05-14: widened from --priority-only (10 states) to --all-states
    # (51 states). OpenStates free tier handles this — ~150 API calls
    # per run, well under the 100k/day limit.
    needs: legiscan-wide-pass
    # Sequencing only (protects the shared OpenStates quota) — committees
    # don't consume legiscan output, so run even if the sweep failed/timed out.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Sync committee assignments across ALL 51 states
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
        run: node scripts/sync-committees-openstates.mjs --all-states --max-minutes 50

  draft-legislator-stance:
    # Multi-state expansion of the legislator-stance pipeline.
    # 2026-05-14: widened from --priority-only (10 states) to --all-states
    # (51 states). Each run skips already-stanced legislators, so the
    # first run may take a while (catching up the 41 newly-covered states)
    # but steady-state cost remains low (only NEW candidates with
    # sponsorships or kratom committee memberships).
    #
    # Stances land as draft in legislator_stance (topic=kratom) with rationale_md
    # populated; admin reviews + flips final stance at /admin/stance.
    #
    # Runs AFTER sync-committees-openstates so today's committee data
    # is available when AI is asked to draft. Falls through to local
    # Ollama when cloud providers are saturated — graceful catchup
    # over multiple daily runs is fine.
    needs: sync-committees-openstates
    # Run even if the committee sync failed — stance drafting degrades
    # gracefully with yesterday's committee data.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Draft legislator stances across ALL 51 states
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: node scripts/draft-legislator-stance.mjs --all-states --max-minutes 80

  discover-municipal-meetings:
    # Discover city/county council + town-hall meetings with kratom
    # (or related: gas-station-heroin, 7-OH, tianeptine) on the agenda.
    # Uses Gemini grounded search per state. Found meetings land in
    # pending_review for admin moderation; once approved they fire
    # 7d/3d/1d push reminders to users in the locality.
    #
    # 2026-05-14: widened from --priority-only (10 states) to --all-states
    # (51 states). ~51 Gemini grounded calls per run, well under the
    # 1500/day free tier.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Discover municipal meetings across ALL 51 states
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/discover-municipal-meetings.mjs --all-states
      - name: Re-check watchlist bodies for upcoming kratom agenda items
        # Targeted re-check of legislative bodies that have previously
        # hosted a kratom item. Derived from municipal_meetings rows
        # where kratom_relevance='confirmed'. Closes the "tabled
        # resolution" loop — when Suffolk County Legislature recesses
        # I.R. 1279-2026 to the next General Meeting, we'll catch the
        # next agenda by name rather than relying on generic state-
        # wide news search. continue-on-error so a Gemini quota event
        # doesn't kill the daily run.
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/recheck-watchlist-meetings.mjs --limit 25

  fire-meeting-reminders:
    # Push reminders for upcoming approved meetings — 7d / 3d / 1d
    # before the meeting fires. Each window is per-meeting dedupe'd
    # via reminder_Nd_sent_at columns; if a meeting already got the
    # "LIVE NOW" broadcast it's skipped here.
