# THROWAWAY — ghost-server Stage-1 canary. Measures whether the nightly
# search + page-fetch legs survive on a GitHub Actions Azure IP, and whether
# SearXNG runs as an ephemeral in-job container. Delete this branch after.
name: Ghost canary
on:
  push:
    branches: [ghost-canary]
  workflow_dispatch: {}
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Page-fetch canary (Azure IP)
        continue-on-error: true
        env:
          CANARY_LEG: github-actions
        run: node scripts/_ghost_canary/canary-fetch-targets.mjs

      - name: Start in-job SearXNG container
        run: |
          docker run -d --name searxng -p 8080:8080 \
            -e SEARXNG_SECRET="$(openssl rand -hex 32)" \
            -v "${{ github.workspace }}/scripts/_ghost_canary/settings.yml:/etc/searxng/settings.yml:ro" \
            searxng/searxng:latest
          echo "waiting for searxng..."
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080/search?q=test&format=json" || true)
            if [ "$code" = "200" ]; then echo "ready after ${i}s"; break; fi
            sleep 2
          done

      - name: SearXNG search probe (Azure IP)
        continue-on-error: true
        env:
          SEARXNG_URL: http://localhost:8080
        run: node scripts/_ghost_canary/canary-searxng-probe.mjs

      - name: SearXNG container logs (always)
        if: always()
        run: docker logs searxng 2>&1 | tail -40 || true
