name: Weekly update auto-draft

# Writes a WEEKLY "what's new" draft (7-day lookback) into the `patch_notes`
# table with status='draft', so an admin has one week's changes to curate at
# /admin/whats-new. The daily job (auto-patch-notes.yml) does the same thing
# with a 24-hour window.
#
# ⚠️ CHANGED 2026-11-05 — read before editing.
# This used to open a pull request adding a src/content/patch-notes/*.md file.
# Merging that cost a 15-credit Netlify build for a note the database publishes
# for free, the same trap auto-patch-notes.yml left on 2026-09-17, and a merged
# file also fed the Sunday push that has since been removed from cron-weekly.yml.
#
# WHAT HAPPENS TO THE DRAFT:
#   1. This job writes it. It sends nothing, and nobody can see it yet.
#   2. An admin edits it and presses Publish at /admin/whats-new. That puts it on
#      the public page, and sends nothing either.
#   3. Telling members is a separate step: broadcast-whats-new.mjs, run by hand
#      with --dry-run first, after the owner says yes in chat (AGENTS.md rule 3).
#      No workflow runs it on any trigger, and
#      tests/patch-notes-publishing.test.ts fails if one starts to.
#
# Schedule: Sunday 15:00 UTC (~10am ET), so a fresh draft is waiting Monday
# morning. The daily job runs on weekdays only, so the two never share a slug
# on schedule. A manual weekday run shares that day's YYYY-MM-DD-update slug: the
# later write replaces the draft, and neither can touch a published note.

on:
  schedule:
    - cron: "0 15 * * 0"
  workflow_dispatch: {}

concurrency:
  group: auto-weekly-update
  cancel-in-progress: false

jobs:
  draft-weekly-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Read-only: no branch, no pull request.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history for the 7-day git-log lookback

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - run: npm ci --omit=dev --ignore-scripts

      - name: Write the 7-day draft into patch_notes
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # Writes scraper_runs source `patch_note_draft`, the same source as the
        # daily job, registered in scripts/lib/cron-pager-registry.mjs.
        run: node --import=./scripts/lib/egress-meter.mjs scripts/generate-patch-note.mjs --since "7 days ago" --db
