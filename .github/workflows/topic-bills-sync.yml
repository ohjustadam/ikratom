name: Topic classify

# Keyless half of the multi-topic refresh for the /topics explorer:
#   - classify-bill-topics.mjs: re-tags bills.bill_topics as new kratom bills
#     sync in (keyless keyword pass).
#
# NOTE: the LegiScan DISCOVERY half (discover-topic-bills.mjs) runs on the OWNER
# BOX (run-nightly-steps.cmd), NOT here — LegiScan's getSearch query API refuses
# connections from GitHub Actions datacenter IPs (verified: 6/6 connect timeouts
# on two dispatches), while it works from the box's residential IP. (The kratom
# LegiScan sync works on GHA because it pulls getDataset ZIPs from a CDN, not the
# query API.) See run-nightly-steps.cmd.
#
# Self-gates to weekly via scraper_runs (bill_topics_classify); dispatch passes
# --force. `|| true` keeps a blip from failing the badge — telemetry is truth.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Override the weekly self-gate (run now)"
        type: boolean
        default: true
  schedule:
    # Weekly, Wednesday 07:10 UTC — staggered off the Sunday weekly cron + the
    # Monday portrait sync so the shared CI window isn't contended.
    - cron: "10 7 * * 3"

concurrency:
  group: topic-bills-sync
  cancel-in-progress: false

jobs:
  topic-bills:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Compute force flag
        id: flags
        run: |
          FORCE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force }}" != "false" ]; then FORCE="--force"; fi
          echo "force=$FORCE" >> "$GITHUB_OUTPUT"
      - name: Tag existing bills by topic (keyless)
        run: node scripts/classify-bill-topics.mjs ${{ steps.flags.outputs.force }} || true
