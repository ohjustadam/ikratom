name: Topic bills sync

# Keeps the multi-topic data fresh for the /topics explorer (phase 1+2):
#   - classify-bill-topics.mjs: re-tags bills.bill_topics as new kratom bills
#     sync in (keyless keyword pass).
#   - discover-topic-bills.mjs: discovers NON-kratom bills (cannabis, hemp,
#     psychedelics, supplements, tobacco, alcohol) via LegiScan getSearch into
#     the separate topic_bills table.
#
# Both self-gate to weekly via scraper_runs (bill_topics_classify /
# topic_bill_discovery) and are registered in check-cron-staleness.mjs, so a
# manual dispatch passes --force to override the gate; the weekly tick is a
# no-op if a dispatch ran recently. Steps are `|| true` so one source failing
# (e.g. LegiScan blip) doesn't block the other — the telemetry row records the
# real outcome (scraper_runs is the source of truth, not the workflow badge).

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Override the weekly self-gate (run now)"
        type: boolean
        default: true
  schedule:
    # Weekly, Wednesday 07:10 UTC — staggered off the Sunday weekly cron + the
    # Monday portrait sync so the shared CI window isn't contended.
    - cron: "10 7 * * 3"

concurrency:
  group: topic-bills-sync
  cancel-in-progress: false

jobs:
  topic-bills:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Compute force flag
        id: flags
        run: |
          FORCE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force }}" != "false" ]; then FORCE="--force"; fi
          echo "force=$FORCE" >> "$GITHUB_OUTPUT"
      - name: Tag existing bills by topic (keyless)
        run: node scripts/classify-bill-topics.mjs ${{ steps.flags.outputs.force }} || true
      - name: Discover non-kratom bills (LegiScan getSearch)
        run: node scripts/discover-topic-bills.mjs ${{ steps.flags.outputs.force }} || true
