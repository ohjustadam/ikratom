name: Topic classify

# Keyless half of the multi-topic refresh for the /topics explorer:
#   - classify-bill-topics.mjs: re-tags bills.bill_topics as new kratom bills
#     sync in (keyless keyword pass).
#
# The LegiScan DISCOVERY half (discover-topic-bills.mjs) now runs HERE too, as of
# 2026-09-17. It used to be owner-box-only on the grounds that LegiScan's getSearch
# query API refuses GitHub Actions datacenter IPs (6/6 connect timeouts across two
# dispatches, July). That is no longer true: scripts/diagnose-cloud-gaps.mjs probed
# it from a runner with the real key and got 3/3 OK in ~100-126ms, 50 rows each,
# with the getDatasetList control passing alongside. Dispatch that probe before
# concluding anything if the timeouts ever return.
#
# Self-gates to weekly via scraper_runs (bill_topics_classify); dispatch passes
# --force. `|| true` keeps a blip from failing the badge — telemetry is truth.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Override the weekly self-gate (run now)"
        type: boolean
        default: true
  schedule:
    # Weekly, Wednesday 07:10 UTC — staggered off the Sunday weekly cron + the
    # Monday portrait sync so the shared CI window isn't contended.
    - cron: "10 7 * * 3"

concurrency:
  group: topic-bills-sync
  cancel-in-progress: false

jobs:
  # ── SUPABASE EGRESS GATE (bulk tier) ──────────────────────────────────
  # Weekly bulk sweep over the bill corpus. Same 2026-09-16 audit as
  # portrait-sync: nothing here is time-critical, so it yields early.
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --ignore-scripts
      - id: gate
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/egress-gate.mjs --tier bulk
  topic-bills:
    needs: budget
    if: needs.budget.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Compute force flag
        id: flags
        run: |
          FORCE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force }}" != "false" ]; then FORCE="--force"; fi
          echo "force=$FORCE" >> "$GITHUB_OUTPUT"
      - name: Tag existing bills by topic (keyless)
        run: node scripts/classify-bill-topics.mjs ${{ steps.flags.outputs.force }} || true

      # Discovery runs AFTER the keyless pass so a LegiScan outage can never cost
      # us the classification work. The script self-gates to every 6 days off its
      # own scraper_runs row, so the weekly schedule plus a stray dispatch cannot
      # double-spend the ~30k/month LegiScan query allowance.
      - name: Discover non-kratom topic bills (LegiScan getSearch)
        env:
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
        run: node scripts/discover-topic-bills.mjs ${{ steps.flags.outputs.force }} || true
