name: Hourly cron

# Vercel Hobby plan only allows daily crons. We use GitHub Actions for
# anything sub-daily:
#
#   1. fire-waves       — HTTP call to /api/cron/fire-waves (existing
#                          email/push fan-out)
#   2. news-pipeline    — runs scripts/sync-news-rss.mjs +
#                          scripts/classify-news-policy.mjs +
#                          scripts/auto-campaign-from-alert.mjs to
#                          ingest hourly news, classify into alerts,
#                          and auto-spawn solidarity campaigns. This
#                          closes the city/county/AG blind spot —
#                          Marshall-IL-style bans are caught within
#                          ~60 min of publication.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CRON_SECRET                   same value as Vercel env var
#   APP_URL                       deployed origin, e.g. https://www.ikratom.org
#   NEXT_PUBLIC_SUPABASE_URL      from Supabase Settings → API
#   SUPABASE_SERVICE_ROLE_KEY     from Supabase API Keys (sb_secret_…)
#   OPENSTATES_API_KEY            (for any bill-related cron jobs)
#   GROQ_API_KEY                  AI classifier
#   GEMINI_API_KEY                AI classifier
#   CEREBRAS_API_KEY              AI classifier (optional 3rd cloud)
#
# GitHub Actions cron is best-effort — runs may be skipped or delayed
# a few minutes under high load. That's fine; news + alerts target
# < 1 hour latency, not real-time.

on:
  schedule:
    # GitHub Actions cron is best-effort under load — observed actual
    # cadence with single 'hourly' schedule was every 2-3h. Two
    # schedules at :00 and :30 double our chances of hitting close
    # to the hour. The concurrency lock below prevents pile-up if
    # both fire while a prior run is still going.
    - cron: "0 * * * *"
    - cron: "30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: hourly-cron
  cancel-in-progress: false

jobs:
  fire-waves:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit /api/cron/fire-waves
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$APP_URL" ]; then
            echo "::error::Missing CRON_SECRET or APP_URL repo secret"
            exit 1
          fi
          curl -fsS --max-time 240 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/fire-waves"

  news-pipeline:
    # News scrape → classify → auto-campaign. Runs alongside fire-waves
    # but in its own job so a failure in one doesn't kill the other.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies (production only)
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Sync Google News RSS across all states
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-news-rss.mjs
      - name: Classify newly-ingested news into policy_alerts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --limit 80 (was 200): 200/hr front-loaded the free-tier daily
        # quota; once exhausted, every later item + later cron fell
        # through to (absent) Ollama and failed. 80/hr still drains any
        # realistic backlog across a few ticks, and the script's circuit
        # breaker (scripts/lib/batch-guard.mjs) stops early if providers die.
        run: node scripts/classify-news-policy.mjs --limit 80
      - name: Auto-push approved critical alerts to in-state users
        # Runs after the classifier so any newly-approved alerts this
        # hour get pushed in the same cron tick. Whitelist of kinds
        # excludes admin-only data-quality flags (scraper_stale, etc.)
        # Per-alert dedupe via policy_alerts.auto_pushed_at.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.APP_URL }}
        run: node scripts/push-critical-alerts.mjs
      - name: Push bill_actions to users who took action on them
        # Surgical-targeted notifications: when a bill changes status
        # (e.g. enacted, signed, dead in committee), find every user
        # who emailed their rep about that bill via campaign_actions
        # and push them. Per-user-per-action dedupe via
        # bill_action_user_pushes (migration 0121).
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/push-bill-actions-to-actors.mjs
      - name: Push high-relevance state news to in-state users
        # Complements push-critical-alerts: not all newsworthy stories
        # become policy_alerts, but high-relevance state-specific news
        # (>= 0.85 score, < 12h fresh, body-verified kratom mention)
        # deserves to reach in-state advocates. Strict gating + per-
        # item dedupe via news_items.auto_pushed_at (migration 0122).
        # Skips items whose linked policy_alert already auto-pushed.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/push-state-news.mjs
      - name: Auto-create campaigns from new actionable alerts (safety net)
        # As of migration 0068, this is handled in real-time by a Postgres
        # trigger (`trg_auto_campaign_on_alert`). Keeping the cron run as
        # a safety net: if the trigger errors out for any reason, or if
        # we backfill alerts created before the trigger existed, the
        # script's `--all-pending` filter will find them and finish the
        # job. In normal operation it's a no-op.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/auto-campaign-from-alert.mjs --all-pending
      - name: Promote city-ordinance alerts into bills rows
        # When a news alert describes a "City, ST — ..." event, wrap it
        # as a bills row with scope=municipal so it appears in /bills,
        # /pulse, and the bill detail page renders the full UI.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/promote-alert-to-bill.mjs --all-bill-events
      - name: Extract structured local-event metadata from alerts
        # AI-parses the alert body into local_meta jsonb (meeting time,
        # Zoom URL, dial-ins, public-comment email + deadline, etc.) so
        # /bills/[id] can render calendar buttons + mailto/tel links.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/extract-local-meta.mjs --all-municipal
      - name: Seed full city-council slate for new municipal bills
        # Gemini Search grounding pulls mayor + ALL council members for
        # any new municipal-scope bill that doesn't have officials yet.
        # Skips localities that already have a slate.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/seed-bill-officials.mjs --all-municipal
      - name: Extract officials from news alerts + make them actionable
        # Runs AFTER auto-campaign-from-alert (so campaigns exist) and
        # seed-bill-officials. For each unprocessed action-required news
        # alert: AI-extract the precise city/county jurisdiction, seed
        # that locality's full official slate via Gemini grounding (also
        # growing our nationwide officials DB), then retarget the alert's
        # auto-campaign onto those local officials so the alert is
        # one-click actionable against the right people. Free-tier AI
        # only; self-heals on Gemini quota (leaves unprocessed to retry).
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: node scripts/extract-news-officials.mjs --limit 25
      - name: Extract future civic events from news → calendar
        # Mines already-scraped news articles for future-dated civic
        # events (council votes, hearings, comment deadlines, ban
        # effective dates) and seeds them into municipal_meetings as
        # pending_review. Complements discover-municipal-meetings (web
        # grounding search) by catching dates stated in news we already
        # have. Uses the cheap multi-provider router (no grounding) —
        # the date is in the article text. Admin approves before they
        # hit the public calendar / fire reminders.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/extract-news-events.mjs --limit 25
      - name: Auto-approve high-confidence municipal meetings
        # Applies the admin auto-approval policy (site_config): promotes
        # pending_review meetings at/above the confidence threshold (and
        # with a source link, if required) to approved so they hit
        # /calendar + fire reminders without a manual click. Low-
        # confidence rows stay queued. Every approval is audit-logged.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/auto-approve-meetings.mjs
      - name: Auto-post active anti/pro bills to state forums
        # Posts a system thread to /forum/<state> for any active anti- or
        # pro-kratom bill that doesn't already have a forum thread. Caps
        # at 25 posts per run so the first cron tick after deploy doesn't
        # dump every backlog bill at once. Idempotent via bills.forum_thread_id.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
        run: node scripts/auto-post-bills-to-forum.mjs
      - name: LegiScan primary sync for active anti bills (Layer 2)
        # Hourly: pulls fresh action history from LegiScan for the 30
        # most-stale active anti bills. Writes new actions to
        # bill_actions (deduped); the 0076 trigger fires per row,
        # auto-spawning critical/alert policy_alerts. Falls back to
        # no-op if LEGISCAN_API_KEY isn't set.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
        run: node scripts/sync-bills-via-legiscan.mjs --priority
      - name: Post critical bill alerts to Discord channels
        # Scans policy_alerts for severity in (critical, alert) with
        # kind='bill_event' that haven't been Discord-posted yet (last
        # 7 days). Posts to every active Discord integration whose
        # state_filter matches the alert's locality. Marks
        # discord_posted_at so re-runs are idempotent.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
        run: node scripts/post-bill-alerts-to-discord.mjs
      - name: Fan out bill subscription notifications
        # Hourly: fires a meeting-reminder notification when a bill's
        # meeting falls in the next 24h (one-shot per subscription) +
        # status-change notifications for any subscribed bill whose
        # status moved. Idempotent via per-subscription tracking
        # columns. Push fan-out is handled by /api/cron/fire-waves.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/fanout-bill-reminders.mjs
      - name: Extract bill numbers from alerts + news (auto-promote to bills)
        # Detects resolution / ordinance / bill numbers in approved
        # policy_alerts and active body-verified news_items, then
        # promotes to bills table when no matching (state, bill_number)
        # row exists. Closes the gap exposed 2026-05-14 by Suffolk
        # County Resolution 1279-2026: we caught news + meeting + 11
        # alerts but had no tracked bill row for the resolution itself.
        # Conservative regex; declines federal-pattern matches to
        # avoid "U.S. 7-O" → "S. 7" false positives. Idempotent.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/extract-bills-from-alerts.mjs --limit 2000
      - name: Fire user-set custom reminders
        # User-controlled reminders set via 🔔 Remind me button on
        # bills/meetings/etc. (migration 0132). Hourly because
        # reminder_at is user-set arbitrary minute granularity — not
        # aligned to the daily-cron windows that the 7d/3d/1d meeting
        # reminders use. Cheap: partial index over the "due" rows
        # makes the query trivial. Push delivery rides the existing
        # fire-waves fanout that fires next.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
        run: node scripts/fire-custom-reminders.mjs
      - name: Scrape protectkratom.org state alert pages
        # AKA publishes time-sensitive state-level kratom-policy alerts
        # (BoP rulings, city-council hearings, governor vetoes) on
        # protectkratom.org/<state> — typically hours-to-days ahead of
        # public news indexing. We scrape, classify severity + kind,
        # and upsert into policy_alerts as `pending` for admin review.
        # Idempotent via dedupe_key. Hourly so new AKA alerts surface
        # within an hour of being posted.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/scrape-protectkratom-org.mjs
      - name: Correlate news_items to bills (regex pass)
        # Maintains news_items.bill_id linkage. Two regex stages:
        #   1. Copy bill_id from any policy_alerts the news_item is
        #      attached to (exact, cheap)
        #   2. Regex-match bill numbers in title/summary against the
        #      bills table when state matches (heuristic, free)
        # Sets bill_correlation_attempted_at on every row processed.
        # AI stage runs daily, not hourly (see cron-daily.yml) — keeps
        # the hourly tick light.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/correlate-news-to-bills.mjs
      - name: Dedupe news by title (exact-syndication case)
        # Google News RSS re-surfaces the same article under multiple
        # per-state queries — same title, different per-query URL, so
        # the upsert-by-url dedupe at scrape time doesn't catch them.
        # This script normalizes titles and marks duplicates so the
        # /news and /brief filters collapse them. Embedding-based dedupe
        # (dedupe-news.mjs) is still the gold path for paraphrased
        # near-duplicates — owner runs it from a machine with Ollama.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/dedupe-news-by-title.mjs
      - name: Check cron staleness (self-monitoring)
        # Self-monitoring observability. Compares cron-registry expected
        # cadences against scraper_runs.finished_at. If any source is past
        # 3× expected interval, pushes a web-push alert to the owner —
        # once per silent period, tracked in cron_staleness_alerts. When
        # a previously-silent source recovers, the row clears + an audit
        # log entry records the recovery. Sources that have never written
        # telemetry are skipped (grace period). The platform pages itself
        # — admin doesn't have to remember to check /admin/automation.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: node scripts/check-cron-staleness.mjs
