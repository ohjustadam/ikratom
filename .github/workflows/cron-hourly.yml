name: Hourly cron

# Vercel Hobby plan only allows daily crons; everything sub-daily runs here.
#
# ⚠️ STRUCTURE (changed 2026-06-18 — read before editing):
# This used to be ONE monolithic `news-pipeline` job with ~25 sequential
# steps under a single `timeout-minutes: 30`. After #632 added the
# resolve→extract→summarize→digest enrichment chain, the job stopped
# fitting in 30 min — sync-news-rss alone takes ~16 min — and every run
# from ~2026-06-16 20:00 onward hit the wall mid-extract and was cancelled.
# Because the timeout is PER-JOB, every step after extract (~18 of them,
# INCLUDING the check-cron-staleness self-watchdog, which was the very last
# step) silently stopped running hourly for ~2 days, and the watchdog being
# downstream of the timeout meant the platform could no longer page itself.
#
# Fix: split the work across jobs that each fit their own timeout. The hourly
# wall-clock can exceed 30 min now (the limit is per-job), so the total
# pipeline completes again. The watchdog is its own job with `if: always()`
# so it ALWAYS runs and ALWAYS runs last (accurate telemetry), independent of
# whether enrichment/actions succeed.
#
#   fire-waves              — HTTP /api/cron/fire-waves (push/email fan-out)
#   daily-brief-audio-...   — self-heal today's brief audio if missing
#   news-intake             — scrape RSS + classify into policy_alerts
#   news-enrich  (needs intake) — resolve→extract→summarize→digest (#632 fast path)
#   news-actions (needs intake) — pushes, auto-campaigns, bill sync, discord, etc.
#   watchdog (needs enrich+actions, if: always()) — check-cron-staleness
#
# Required repo secrets: CRON_SECRET, APP_URL, NEXT_PUBLIC_SUPABASE_URL,
#   SUPABASE_SERVICE_ROLE_KEY, OPENSTATES_API_KEY, LEGISCAN_API_KEY,
#   GROQ_API_KEY, GEMINI_API_KEY, CEREBRAS_API_KEY, MISTRAL_API_KEY,
#   CLOUDFLARE_AI_TOKEN, CLOUDFLARE_ACCOUNT_ID, VAPID_* .

on:
  schedule:
    # EGRESS-SURVIVAL CADENCE (2026-07-16): widened from hourly (`0 * * * *`)
    # to every 2h. The free-tier Supabase project hit its 5GB/mo EGRESS cap
    # (7.3GB, 146%) and was restricted — with only ~10 MAU the driver is this
    # fixed-schedule cron read volume, not user traffic. This hourly workflow
    # (~24 runs/day of RSS sync + classify + fan-out + ~18 action steps) is the
    # single biggest recurring reader; halving its cadence ~halves its egress.
    # News/alerts target <1h latency, not real-time, and the pipeline drains
    # any backlog across ticks, so ~2h latency is an acceptable TEMPORARY cost.
    # FULLY REVERSIBLE: restore `0 * * * *` once the read-caching work (PR3 /
    # Lever A — unstable_cache on public pages) lands and egress headroom is
    # confirmed. Kept single-schedule (not :00+:30) since the 2026-06-08 OOM.
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

concurrency:
  group: hourly-cron
  cancel-in-progress: false

jobs:
  fire-waves:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit /api/cron/fire-waves
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$APP_URL" ]; then
            echo "::error::Missing CRON_SECRET or APP_URL repo secret"
            exit 1
          fi
          # This step has returned 403 on every run since 2026-07-26T15:00 —
          # the push/email fan-out has simply not run, with nothing failing
          # anywhere a user could see.
          #
          # What is RULED OUT so far:
          #   - Not auth. This route only ever returns 401 (route.ts:26); it has
          #     no 403 path at all, so the 403 is not coming from the app.
          #   - Not the UA alone. Adding cron-daily's browser-ish UA (#857) did
          #     NOT fix it — the very next run still returned 403.
          #   - Not a blanket edge block on this host or path prefix.
          #     cron-daily's curl to /api/cron/reverify-local-officials, with
          #     the SAME UA, host and auth header, genuinely succeeds (step
          #     conclusion "success", not masked by its continue-on-error), and
          #     both paths return a normal 401 to a bogus token from a
          #     residential IP. So it is specific to this path from GitHub's
          #     datacenter IPs.
          #
          # The reason this took days to narrow is that `curl -fsS` prints the
          # status and throws away everything that would explain it. That is the
          # actual defect being fixed here: capture the response headers and
          # body on failure, so the NEXT occurrence names its own cause
          # (CF-RAY + cf-mitigated identify a Cloudflare block and which rule;
          # an x-nf-request-id with no cf-mitigated means Netlify answered).
          #
          # Behaviour on success is unchanged: still exits non-zero on a bad
          # status, so a genuine outage still fails the run.
          set -o pipefail
          HDR="$(mktemp)"; OUT="$(mktemp)"
          code=$(curl -sS --max-time 240 \
            -A "iKratom-Cron/1.0 (+https://www.ikratom.org; Mozilla/5.0 compatible)" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -D "$HDR" -o "$OUT" -w "%{http_code}" \
            "$APP_URL/api/cron/fire-waves") || code="000"

          if [ "$code" = "200" ]; then
            echo "fire-waves OK ($code)"
            head -c 500 "$OUT"; echo
          else
            echo "::error::fire-waves returned HTTP $code"
            echo "--- edge/origin headers (identifies WHO refused) ---"
            grep -iE '^(HTTP/|cf-ray|cf-mitigated|cf-cache-status|server|x-nf-request-id|retry-after|location)' "$HDR" || true
            echo "--- first 500 bytes of body ---"
            head -c 500 "$OUT"; echo
            exit 1
          fi

  daily-brief-audio-selfheal:
    # Self-heal: render TODAY's brief audio if it's missing. --if-missing is a
    # cheap no-op once today's file exists, so it's safe every hour and
    # guarantees same-day audio regardless of the daily cron.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Render today's brief audio if missing
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/render-daily-brief-audio.mjs --if-missing

  news-intake:
    # The essential, always-must-run leg: scrape Google News RSS across all
    # states, then classify newly-ingested items into policy_alerts. These are
    # the heaviest steps (sync ~16 min, classify ~8 min) so they get their own
    # job + budget; everything else depends on them having run.
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Sync Google News RSS across all states
        # ~14-min budget inside the 28-min news-intake step: a Google throttling
        # window can't push RSS past the cap and cascade-skip news-enrich/actions.
        run: node scripts/sync-news-rss.mjs --max-minutes 14
      - name: Classify newly-ingested news into policy_alerts
        # --limit 80: 200/hr front-loaded the free-tier daily quota; 80/hr
        # still drains any realistic backlog across ticks. Circuit breaker
        # (scripts/lib/batch-guard.mjs) stops early if providers die.
        run: node scripts/classify-news-policy.mjs --limit 80

  news-enrich:
    # Same-tick in-app enrichment (#632 fast path): resolve → extract body+media
    # → summarize → digest, so a fresh story reads + listens completely on /news
    # within ~1h of going live. Runs in parallel with news-actions after intake.
    # Each step self-gates to unprocessed rows and is --limit-bounded; the
    # daily/nightly crons remain the deep-backlog drain. Steps are
    # continue-on-error so a transient provider/robots wall can't fail the leg.
    needs: news-intake
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Resolve Google redirect URLs (fresh items)
        # Clean GHA IP — the owner box gets Google-throttled. Higher limit keeps
        # fresh items resolving fast AND drains the resolve backlog (newest-first).
        continue-on-error: true
        run: node scripts/resolve-news-urls.mjs --limit 200
      - name: Extract article body + embedded media (fresh items)
        # HTTP fetch only; bounded retry (body_extract_attempts) self-heals walls.
        # Runs before the slow AI steps below, so it always gets its budget.
        # Limit raised to keep the content-ready gate (news only shows once
        # body+media are extracted) opening fast + drain the extract backlog.
        continue-on-error: true
        run: node scripts/extract-news-content.mjs --limit 200
      - name: Summarize fresh articles (our AI synthesis)
        continue-on-error: true
        run: node scripts/summarize-news.mjs --limit 80
      - name: Generate full in-app digest for fresh articles
        continue-on-error: true
        run: node scripts/generate-news-digest.mjs --limit 100 --concurrency 6

  news-actions:
    # Everything downstream of intake: push fresh alerts/news, auto-spawn and
    # auto-approve campaigns, promote/seed bills + officials, calendar events,
    # forum + discord posts, hourly LegiScan priority sync, reminders, and the
    # protectkratom.org early-warning scrape. Runs in parallel with news-enrich
    # (the enrich-dependent steps self-gate, so they pick up the prior tick's
    # enriched rows — a 1-tick lag, not a stall). Most steps are idempotent
    # no-ops in a quiet hour.
    needs: news-intake
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.APP_URL }}
      APP_URL: ${{ secrets.APP_URL }}
      LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      # Every step below is continue-on-error: they are INDEPENDENT automations
      # sharing one job for runner economy — an early hard throw (e.g. a schema
      # drift in one script) used to abort the tick and silently skip the ~15
      # steps after it (audit 2026-07-16). Each script writes its own
      # scraper_runs telemetry, so real persistent failures still page via
      # check-cron-staleness — job-level green just means "the tick ran".
      - name: Auto-push approved critical alerts to in-state users
        continue-on-error: true
        run: node scripts/push-critical-alerts.mjs
      - name: Push bill_actions to users who took action on them
        continue-on-error: true
        run: node scripts/push-bill-actions-to-actors.mjs
      - name: Push high-relevance state news to in-state users
        continue-on-error: true
        run: node scripts/push-state-news.mjs
      - name: Auto-create campaigns from new actionable alerts (safety net)
        # Real-time path is the 0068 Postgres trigger; this is the backstop.
        continue-on-error: true
        run: node scripts/auto-campaign-from-alert.mjs --all-pending
      - name: Promote city-ordinance alerts into bills rows
        continue-on-error: true
        run: node scripts/promote-alert-to-bill.mjs --all-bill-events
      - name: Extract structured local-event metadata from alerts
        continue-on-error: true
        run: node scripts/extract-local-meta.mjs --all-municipal
      - name: Seed full city-council slate for new municipal bills
        continue-on-error: true
        run: node scripts/seed-bill-officials.mjs --all-municipal
      - name: Extract officials from news alerts + make them actionable
        # A 429/parse failure here must not fail the whole leg (self-heals next hour).
        continue-on-error: true
        run: node scripts/extract-news-officials.mjs --limit 25
      - name: Extract future civic events from news → calendar
        continue-on-error: true
        run: node scripts/extract-news-events.mjs --limit 25
      - name: Auto-approve high-confidence municipal meetings
        continue-on-error: true
        run: node scripts/auto-approve-meetings.mjs
      - name: Auto-approve high-confidence campaigns (shadow until owner promotes)
        continue-on-error: true
        run: node scripts/auto-approve-campaigns.mjs
      - name: Auto-post active anti/pro bills to state forums
        continue-on-error: true
        run: node scripts/auto-post-bills-to-forum.mjs
      - name: LegiScan primary sync for active anti bills (Layer 2)
        continue-on-error: true
        run: node scripts/sync-bills-via-legiscan.mjs --priority
      - name: Post critical bill alerts to Discord channels
        continue-on-error: true
        run: node scripts/post-bill-alerts-to-discord.mjs
      - name: Fan out bill subscription notifications
        continue-on-error: true
        run: node scripts/fanout-bill-reminders.mjs
      - name: Extract bill numbers from alerts + news (auto-promote to bills)
        # --limit 500: pulling 2000+2000 rows materialized a multi-MB working
        # set on the ~400MB instance hourly; 500 still drains across ticks.
        continue-on-error: true
        run: node scripts/extract-bills-from-alerts.mjs --limit 500
      - name: Fire user-set custom reminders
        continue-on-error: true
        run: node scripts/fire-custom-reminders.mjs
      - name: Scrape protectkratom.org state alert pages
        # AKA posts time-sensitive state alerts hours-to-days ahead of news.
        continue-on-error: true
        run: node scripts/scrape-protectkratom-org.mjs
      - name: Correlate news_items to bills (regex pass)
        continue-on-error: true
        run: node scripts/correlate-news-to-bills.mjs
      - name: Dedupe news by title (exact-syndication case)
        continue-on-error: true
        run: node scripts/dedupe-news-by-title.mjs

  watchdog:
    # Self-monitoring observability. MUST run every hour and MUST run last so
    # its staleness check sees this tick's fresh telemetry. `if: always()` runs
    # it even if news-enrich/news-actions failed or timed out — the whole point
    # is to detect that. It is its OWN job (≤6 min) so it can never again be
    # starved by an upstream timeout (the 2026-06-16→18 incident this split fixes).
    needs: [news-enrich, news-actions]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Check hosting health (Netlify meters + Vercel spare + live site)
        # The HOSTING failsafe. Two outages built this step:
        #   2026-07-22 — Vercel soft-blocked on Fluid CPU, 402 for ~18h.
        #   2026-07-30 — Netlify DISABLED the site for credit exhaustion while
        #                this very step reported healthy, because it watched
        #                bandwidth (0.77GB/100GB = 0.8%) instead of credits.
        # Checks now:
        #   - NETLIFY (live host since 2026-07-26): CREDITS — the pooled budget
        #     that actually disables the site. Deploys are 15 credits each and
        #     were 75% of the burn that killed us. Warns at 65/80, brakes at 90.
        #     Bandwidth is no longer a ceiling, just a 20-credits/GB input.
        #   - VERCEL (cold spare): reported, escalated only if HOST_PLATFORM=vercel.
        #   - A synthetic GET of the real public URL — cause-agnostic, and the
        #     only check that survives a host migration without an edit.
        # continue-on-error so an API hiccup can't starve the staleness check
        # below, which is the older and broader watchdog.
        continue-on-error: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          # Unset secrets resolve to "" and the script's `||` fallbacks take
          # over, so these are safe to wire before the values exist. They make
          # "an account move is an env change, not a code change" actually true.
          NETLIFY_ACCOUNT_SLUG: ${{ secrets.NETLIFY_ACCOUNT_SLUG }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          HOST_PLATFORM: ${{ secrets.HOST_PLATFORM }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          APP_URL: ${{ secrets.APP_URL }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: node scripts/check-vercel-usage.mjs

      - name: Check cron staleness (self-monitoring)
        # Compares cron-registry expected cadences against scraper_runs.finished_at;
        # web-pushes the owner once per silent period (cron_staleness_alerts) and
        # clears + audit-logs on recovery. The platform pages itself.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Pass both key names — the script prefers NEXT_PUBLIC_ (the one the
          # rest of the platform uses) and falls back to the bare name.
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: node scripts/check-cron-staleness.mjs
