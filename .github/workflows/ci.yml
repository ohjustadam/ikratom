name: CI

# Pull-request CI gate. Catches:
#   - TypeScript errors
#   - Test failures
#   - Build failures (Next.js production build)
#   - High/critical npm CVEs in dependencies
#
# Runs on every PR + on pushes to main (to catch the rare squash-merge
# that introduced a regression). Uses ubuntu-latest + Node 22 to match
# Vercel's runtime. ~2 minutes per run.
#
# Free on public repos (unlimited Actions minutes).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Verify (typecheck + tests)
        run: npm run verify
      - name: Report safety-suite coverage
        # `verify` is green even when the RLS and rate-limit suites never ran
        # (rls.test.ts is excluded; rate-limit self-skips without DB env, and
        # this job has no env: block). Green that proves nothing is worse than
        # red. This surfaces the gap on every run as a warning annotation; it
        # never blocks, because the real fix is a dedicated Supabase test
        # project, not pointing prod credentials at a suite that creates users.
        if: always()
        run: node scripts/report-safety-coverage.mjs

  build:
    name: Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Build
        # Build needs env vars at compile time; provide minimal stubs.
        # Real values come from Vercel at deploy time.
        #
        # SUPABASE_SERVICE_ROLE_KEY stub added 2026-07-23: once the root layout
        # stopped forcing every route dynamic, pages became eligible to
        # PRERENDER at build time, and createServiceRoleClient() THROWS when the
        # key is absent ("fail fast rather than silently masquerading as an anon
        # client" — correct, don't weaken it). Without a stub the build died on
        # /states. A fake value is right here: it lets the client construct so
        # prerender proceeds, while pointing at example.supabase.co means no PR
        # build ever touches the real database (which would also burn egress).
        # Vercel supplies the genuine key at deploy time, so production
        # prerenders against live data as intended.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: stub-anon-key
          SUPABASE_SERVICE_ROLE_KEY: stub-service-role-key
          APP_URL: https://www.ikratom.org
        run: npm run build

  responsive:
    name: Responsive guard
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        # playwright-chromium is already a dependency; this fetches the browser
        # binary plus the system libs the runner image does not ship.
        run: npx playwright install --with-deps chromium
      - name: Build
        # Same stubs as the "Next.js build" job -- see that job for why
        # SUPABASE_SERVICE_ROLE_KEY must be present but must NOT be real.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: stub-anon-key
          SUPABASE_SERVICE_ROLE_KEY: stub-service-role-key
          APP_URL: https://www.ikratom.org
        run: npm run build
      - name: Serve + check
        # MUST be a production server. `next dev` does not enforce
        # dynamicParams and lays some things out differently, so a dev check
        # would pass while production is broken.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: stub-anon-key
          SUPABASE_SERVICE_ROLE_KEY: stub-service-role-key
          APP_URL: https://www.ikratom.org
          BASE_URL: http://localhost:3003
        run: |
          npx next start -p 3003 &
          for i in $(seq 1 45); do
            curl -sf -o /dev/null http://localhost:3003/ && break
            sleep 2
          done
          npm run check:responsive

  audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install deps (with lockfile)
        run: npm ci --no-audit --no-fund
      - name: Audit (fail on high+ CVE)
        # `--audit-level=high` filters out moderate/low advisories.
        # Production-relevant only via --omit=dev — devDependency CVEs
        # don't ship to runtime.
        run: npm audit --audit-level=high --omit=dev

  credits:
    name: Netlify credit budget
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # THE BRAKE. On 2026-07-30 the site was disabled for credit exhaustion:
    # 15 production deploys x 15 credits = 225 of a 300-credit monthly budget.
    # Merging to main triggers a production build, so the merge IS the spend —
    # which makes pull_request the only moment a check can still prevent it.
    #
    # This is deliberately a required check rather than a notification. The
    # whole lesson of both outages is that a warning nobody must act on is
    # indistinguishable from no warning at all.
    #
    # No `npm ci`: the gate uses only built-in fetch, so this job is seconds.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Check remaining credits before allowing a deploy
        env:
          # Already configured at repo level (cron-hourly.yml uses it). On fork
          # PRs secrets are absent, and the script then reports SKIPPED and
          # exits 0 — it never reports a false "pass".
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_ACCOUNT_SLUG: ${{ secrets.NETLIFY_ACCOUNT_SLUG }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: node scripts/netlify-credit-gate.mjs
