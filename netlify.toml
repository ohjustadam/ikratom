# Netlify build config for iKratom (Next.js 16).
#
# Added 2026-07-23 for the migration off Vercel (which soft-blocked the account
# on Fluid CPU — see private/GO_LIVE_NETLIFY.md). Netlify officially supports
# Next 16 via the OpenNext adapter with zero config; this file just pins the
# node version and build command so builds are reproducible, and declares the
# adapter explicitly rather than relying on auto-detection.
#
# This file is inert on Vercel (Vercel reads vercel.json), so committing it does
# not affect the current deployment.

[build]
  # --webpack is REQUIRED here. next build defaults to Turbopack in Next 16, and
  # the Netlify adapter compiles proxy.ts (middleware) into an Edge Function via
  # Deno/esbuild — which cannot resolve Turbopack's runtime chunks
  # ("Cannot find module './chunks/[turbopack]_runtime.js'", the first deploy's
  # failure). Webpack-compiled middleware bundles cleanly. Local `npm run build`
  # (Turbopack) stays fast for dev; only the Netlify production build forces
  # Webpack.
  # Keep this EXACTLY as the proven-working command. `next build --webpack` is
  # what the successful CLI deploy used to put the current site live.
  #
  # An earlier attempt prefixed `npm run verify &&` as an extra deploy gate.
  # It made the Netlify build fail (exit 2) while the identical command passed
  # locally AND in CI — including with production env loaded, so it wasn't a
  # credentials problem. Rather than guess at a remote build environment, the
  # gate moved to where it belongs: branch protection on `main` requires
  # "Typecheck + tests" and "Next.js build" to be green in CI's clean, stubbed
  # environment BEFORE anything can merge. That's a better place to run tests
  # than a production-credentialed build container, and it can't wedge deploys.
  #
  # A build gate that blocks every deploy is worse than the risk it mitigates.
  # If we ever re-add verification here, do it as `tsc --noEmit` only (fast,
  # deterministic, no test runner) and confirm against a real build log first.
  # Plain `next build` = Turbopack (the Next 16 default), and that is now the
  # CORRECT choice — the `--webpack` flag that used to be here was a workaround
  # for exactly one problem: the Netlify adapter couldn't edge-bundle Turbopack's
  # middleware output. That middleware (`proxy.ts`) is now disabled entirely, so
  # there is no edge function to bundle and the workaround is obsolete.
  #
  # Keeping it was actively harmful: webpack is far hungrier, and it OOM'd the
  # remote build at 2034MB even after raising the heap to 4096 (Netlify's
  # container evidently can't hand out that much). Turbopack compiles the same
  # 215 routes in ~19s vs ~93s locally, with a fraction of the memory — and CI's
  # "Next.js build" check has been passing on Turbopack this whole time, which is
  # independent evidence it works for this codebase.
  #
  # ⚠ If middleware is ever re-enabled, this must go back to `--webpack` (and the
  # OOM problem returns) unless the adapter has gained Turbopack support by then.
  command = "next build"
  # The Next.js runtime plugin manages the real publish output; this is the
  # conventional value and the plugin overrides it as needed.
  publish = ".next"

  # ── BUILD IGNORE — added 2026-07-30 after the credit outage ────────────────
  # Every production deploy costs 15 credits out of 300/month. 15 deploys in
  # nine days spent 225 of them — 75% of the entire budget — and the site was
  # disabled. A large share of those builds shipped no application change at
  # all: workflow YAML, docs, and migration files.
  #
  # Netlify runs this command per build: exit 0 SKIPS, non-zero BUILDS.
  # So this asks "did anything OUTSIDE the excluded paths change?" — if not,
  # git exits 0 and we skip a 15-credit no-op build.
  #
  # ⚠ TWO EXCLUSIONS THAT LOOK OBVIOUS ARE DELIBERATELY ABSENT — both were
  # tested and both would have caused STALE production builds:
  #
  #   scripts/**  — NOT excluded. 13 modules under scripts/lib/ are imported
  #                 by the app (e.g. src/modules/bop/engine.ts imports
  #                 scripts/lib/bop-engine.mjs). Excluding scripts/ would ship
  #                 stale engine logic. Saving a credit is not worth that.
  #
  #   '*.md'      — the `glob` magic is REQUIRED. Without it git's pathspec
  #                 `*` also matches `/`, so a bare ':(exclude)*.md' silently
  #                 excludes all 35 markdown files under src/content/
  #                 (briefings + patch notes) — which the app renders. With
  #                 ':(exclude,glob)' it matches root-level *.md only.
  #
  # The leading guard fails SAFE: if Netlify does not provide the refs (e.g. a
  # shallow clone), we exit 1 and build rather than skip a real change.
  ignore = "[ -z \"$CACHED_COMMIT_REF\" ] && exit 1; git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- ':(exclude,glob)*.md' ':(exclude)docs/**' ':(exclude).github/**' ':(exclude)tests/**' ':(exclude)supabase/**'"

[build.environment]
  # Match CI + the app's engines expectation.
  NODE_VERSION = "22"
  # REQUIRED — without this the production build dies:
  #   FATAL ERROR: Reached heap limit Allocation failed - JS heap out of memory
  #   Command was killed with SIGABRT: next build --webpack
  # Node defaults to a ~2GB old-space heap and this build peaked right at
  # 2034MB in Netlify's container (it survived locally only because a dev box
  # has more headroom — a classic "works on my machine" that ONLY shows up on
  # the remote builder). 215 routes compiled with **webpack** is the load;
  # webpack is markedly hungrier than Turbopack, and we're pinned to it because
  # Turbopack output can't be edge-bundled by the Netlify adapter. So this is
  # the cost of that trade, not a code regression.
  # 4096 leaves plenty of room under the build image's memory while giving the
  # compile roughly double what it needs.
  NODE_OPTIONS = "--max-old-space-size=4096"
  # NOTE: SUPABASE_SERVICE_ROLE_KEY is deliberately NOT stubbed here.
  #
  # It briefly was, copied from the CI build job — but on Netlify this block
  # does NOT lose to the dashboard env vars the way I assumed. The stub won,
  # so every server render got an invalid service-role client: /donate returned
  # 500 and the donation strip silently vanished sitewide, while the same build
  # served 200 locally (where .env.local supplies the real key). Classic
  # works-on-my-machine, and only visible in production.
  #
  # The stub existed for a window when the site had no env vars at all. All 47
  # real secrets are synced now (scripts/netlify-env-sync.mjs), so the genuine
  # key is present at both build and runtime and the stub is pure harm.
  # CI still stubs it — correct there, since CI must never touch the real DB.

# ORIGIN BYPASS — audit finding 2026-07-26 (MEDIUM).
#
# `ikratom.netlify.app` served the entire app publicly, so any request to that
# hostname skipped Cloudflare completely: Bot Fight Mode, WAF and rate limiting
# all bypassed. That directly undercut the fix for the outage — the crawler load
# Bot Fight Mode was turned on to absorb could simply use the origin URL
# instead.
#
# Verified live before this change: the netlify.app host answered 200 with
# `Server: Netlify` and NO `CF-RAY`, while www.ikratom.org answered with
# `Server: cloudflare` + a CF-RAY. Netlify did not redirect it automatically
# even though the custom domain is primary, so the rule has to be explicit.
#
# A domain-qualified `from` matches ONLY that exact hostname, so deploy previews
# (`deploy-preview-N--ikratom.netlify.app`) and branch deploys are unaffected —
# those must keep serving directly or post-merge verification loses its target.
#
# 308, not 301: it preserves method and body, so anything ever pointed at the
# origin hostname degrades to a working redirect rather than silently becoming a
# GET.
#
# ⚠ This removes the publicly-discoverable bypass; it is NOT origin-level Host
# enforcement — Netlify still answers to that hostname, it just answers with a
# redirect. Fully closing it is a dashboard setting (Netlify → Site
# configuration → Access & security) or Cloudflare Authenticated Origin Pulls.
# See private/AUDIT_2026-07-26.md.
[[redirects]]
  from = "https://ikratom.netlify.app/*"
  to = "https://www.ikratom.org/:splat"
  status = 308
  force = true

[[plugins]]
  package = "@netlify/plugin-nextjs"

# NOTE — crons: vercel.json's two cron jobs (/api/cron/daily-sync,
# /api/cron/reverify-local-officials) are Vercel-only and will NOT run on
# Netlify. Coverage plan in private/GO_LIVE_NETLIFY.md — the fix is to add two
# curl steps to .github/workflows/cron-daily.yml (host-independent), since the
# GitHub Actions crons already carry the rest of the pipeline.
